steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/code-reviewer:$SHORT_SHA", "."]

  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/code-reviewer:$SHORT_SHA"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - code-reviewer
      - --image=gcr.io/$PROJECT_ID/code-reviewer:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-secrets=GITHUB_TOKEN=github-token:latest,GITHUB_WEBHOOK_SECRET=github-webhook-secret:latest,GEMINI_API_KEY=gemini-api-key:latest
      - --set-env-vars=GCP_PROJECT_ID=$PROJECT_ID,USE_CLOUD_TASKS=true

images:
  - "gcr.io/$PROJECT_ID/code-reviewer:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
